services:
  # Banco de dados
  postgres:
    image: postgres:15-alpine
    container_name: ofiador_db
    environment:
      POSTGRES_DB: ofiador
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ofiador_network

  # Backend API
  backend:
    build: ./backend
    container_name: ofiador_backend
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=ofiador;Username=admin;Password=admin123
    depends_on:
      - postgres
    networks:
      - ofiador_network

  # Frontend
  frontend:
    build: ./frontend
    container_name: ofiador_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ofiador_network

networks:
  ofiador_network:
    driver: bridge

volumes:
  postgres_data: