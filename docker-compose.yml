services:
  
  postgres:
    image: postgres:15-alpine
    container_name: ofiador_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ofiador_network

  
  backend:
    build: ./backend/Ofiador.API
    container_name: ofiador_backend
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      - postgres
    networks:
      - ofiador_network

  
  frontend:
    build: ./frontend
    container_name: ofiador_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ofiador_network

networks:
  ofiador_network:
    driver: bridge

volumes:
  postgres_data: